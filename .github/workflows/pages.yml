name: Publish Kniffel to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/icons
          cp .nojekyll index.html manifest.webmanifest sw.js dist/
          cp app-*.js styles-*.css dist/
          cp icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png icons/apple-touch-icon.png dist/icons/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
